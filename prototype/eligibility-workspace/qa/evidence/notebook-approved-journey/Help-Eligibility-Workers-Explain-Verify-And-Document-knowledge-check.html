<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Help Eligibility Workers Explain, Verify, And Document — Knowledge check</title><style>body{margin:0;background:#f3f6f6;color:#17252b;font:16px/1.5 system-ui}.app{max-width:780px;margin:40px auto;padding:28px;background:#fff;border:1px solid #dce4e6;border-radius:14px}button{display:block;width:100%;margin:8px 0;padding:13px;text-align:left;border:1px solid #cbd7da;border-radius:9px;background:#fff}button:hover{background:#edf5f5}.result{margin-top:16px;padding:14px;border-radius:9px;background:#edf5f5}.next{width:auto;color:#fff;background:#17252b}</style></head><body><main class="app"><small>BLUEORIGIN · KNOWLEDGE CHECK</small><h1>Help Eligibility Workers Explain, Verify, And Document</h1><div id="quiz"></div></main><script>const project={"title":"Help Eligibility Workers Explain, Verify, And Document — Knowledge check","questions":[{"id":"question-1","type":"multiple_choice","points":1,"prompt":"Which response best reflects the approved guidance about the requirement?","options":["Eligibility workers must explain which household changes must be reported and the applicable reporting deadline.","Apply the same rule to every program without checking the source.","Wait until the next scheduled review before documenting the change.","Skip verification and close the case immediately."],"shuffle":true,"citations":[{"label":"Household change reporting","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-dfed38c50fa45969","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"}],"difficulty":"applied","explanation":"Eligibility workers must explain which household changes must be reported and the applicable reporting deadline.","correct_index":0},{"id":"question-2","type":"multiple_choice","points":1,"prompt":"Which response best reflects the approved guidance about the required action?","options":["When electronic data is incomplete, eligibility workers should request acceptable proof and explain available options clearly.","Apply the same rule to every program without checking the source.","Wait until the next scheduled review before documenting the change.","Skip verification and close the case immediately."],"shuffle":true,"citations":[{"label":"Verification","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-cceef037d7795d8a","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"}],"difficulty":"applied","explanation":"When electronic data is incomplete, eligibility workers should request acceptable proof and explain available options clearly.","correct_index":0},{"id":"question-3","type":"multiple_choice","points":1,"prompt":"Which response best reflects the approved guidance about verification?","options":["Program-specific reporting requirements must be explicit, without combining different deadlines into a universal rule.","Apply the same rule to every program without checking the source.","Wait until the next scheduled review before documenting the change.","Skip verification and close the case immediately."],"shuffle":true,"citations":[{"label":"Program differences","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-de9b6a3fc296e5d8","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"}],"difficulty":"applied","explanation":"Program-specific reporting requirements must be explicit, without combining different deadlines into a universal rule.","correct_index":0},{"id":"question-4","type":"multiple_choice","points":1,"prompt":"Which response best reflects the approved guidance about exceptions?","options":["Eligibility workers need to confirm reported changes, identify the affected program, request necessary evidence, document the action taken, and inform the household of the next steps.","Apply the same rule to every program without checking the source.","Wait until the next scheduled review before documenting the change.","Skip verification and close the case immediately."],"shuffle":true,"citations":[{"label":"Worker checklist","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-fcf02ef2b17e7cbe","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"}],"difficulty":"applied","explanation":"Eligibility workers need to confirm reported changes, identify the affected program, request necessary evidence, document the action taken, and inform the household of the next steps.","correct_index":0},{"id":"question-5","type":"multiple_choice","points":1,"prompt":"Which response best reflects the approved guidance about the requirement?","options":["Eligibility workers must thoroughly document all aspects of a reported change to ensure compliance and accurate record-keeping.","Apply the same rule to every program without checking the source.","Wait until the next scheduled review before documenting the change.","Skip verification and close the case immediately."],"shuffle":true,"citations":[{"label":"Household change reporting","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-dfed38c50fa45969","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"},{"label":"Worker checklist","block_id":"block:text-544bbf3f-b44b-4bda-982f-861db229d2d7-fcf02ef2b17e7cbe","source_id":"text:544bbf3f-b44b-4bda-982f-861db229d2d7"}],"difficulty":"applied","explanation":"Eligibility workers must thoroughly document all aspects of a reported change to ensure compliance and accurate record-keeping.","correct_index":0}]};let i=0,score=0;const root=document.querySelector('#quiz');function draw(){const q=project.questions[i];root.innerHTML='<p>Question '+(i+1)+' of '+project.questions.length+'</p><h2>'+q.prompt+'</h2>'+q.options.map((x,n)=>'<button data-answer="'+n+'">'+x+'</button>').join('');root.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));}function answer(n){const q=project.questions[i];if(n===q.correct_index)score++;root.innerHTML+='<div class="result"><strong>'+(n===q.correct_index?'Correct':'Review')+'</strong><p>'+q.explanation+'</p><button class="next">'+(i+1===project.questions.length?'See result':'Next question')+'</button></div>';root.querySelector('.next').onclick=()=>{i++;if(i<project.questions.length)draw();else root.innerHTML='<h2>'+score+' / '+project.questions.length+'</h2><p>Knowledge check complete.</p>'};}draw();</script></body></html>
